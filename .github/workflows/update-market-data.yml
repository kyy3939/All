name: Update market data

on:
  schedule:
    # 16:15 KST = 07:15 UTC — 국내장 마감(15:30) 후 데이터 정산 시간을 감안해 실행.
    # 화~금요일 퇴근 후/저녁에 확인할 때 "당일" 국내 시세가 반영되도록.
    - cron: "15 7 * * *"
    # 07:30 KST = (전날) 22:30 UTC — 미국장 마감(여름 기준 05:00 KST 전후) 후 정산 시간을 넉넉히 두고 실행.
    # 출근길 아침에 확인할 때 "전일" 국내+미국 시세가 반영되도록. 월요일 아침엔 금요일자 데이터가 뜬다.
    - cron: "30 22 * * *"
  workflow_dispatch: {}   # Actions 탭에서 "Run workflow" 버튼으로 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r personal/scripts/requirements.txt

      - name: Fetch market data & update stocks.html
        env:
          HTML_PATH: personal/stocks.html
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python personal/scripts/fetch_market_data.py

      - name: Commit & push if changed
        run: |
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          if git diff --quiet -- "$HTML_PATH"; then
            echo "변경 사항 없음 — 커밋 생략"
          else
            git add "$HTML_PATH"
            git commit -m "chore: update market data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
        env:
          HTML_PATH: personal/stocks.html
