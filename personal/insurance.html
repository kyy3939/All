<!DOCTYPE html>

<style>

.tabs{display:flex;gap:7px;overflow:auto;padding:5px;background:#0d131d;border:1px solid #1e2938;border-radius:13px;margin-bottom:18px;scrollbar-width:none}.tab{flex:none;padding:9px 16px;border-radius:9px;color:var(--sub);font-size:12.5px;font-weight:800;cursor:pointer}.tab.active{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 7px 18px rgba(91,140,255,.22)}.tab .count{opacity:.7;font-weight:600}
.hero-dashboard{display:grid;grid-template-columns:1.4fr .8fr;gap:16px;margin-bottom:18px}.hero-main,.hero-side{background:linear-gradient(145deg,rgba(26,36,50,.96),rgba(14,20,30,.96));border:1px solid rgba(255,255,255,.07);border-radius:22px;box-shadow:var(--shadow)}.hero-main{padding:24px;position:relative;overflow:hidden}.hero-main:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-90px;top:-110px;background:radial-gradient(circle,rgba(91,140,255,.35),transparent 70%)}.hero-eyebrow{font-size:11px;color:#91adff;font-weight:900;letter-spacing:.12em}.hero-title{font-size:25px;font-weight:900;margin:7px 0 3px}.hero-desc{font-size:12.5px;color:var(--sub)}.hero-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:23px}.hero-kpi{background:rgba(8,12,19,.5);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:13px}.hero-kpi .v{font-size:21px;font-weight:900;font-variant-numeric:tabular-nums}.hero-kpi .l{font-size:10.5px;color:var(--sub);margin-top:2px}.hero-side{padding:20px}.hero-side h3{margin:0 0 15px;font-size:14px}.legend-row{display:grid;grid-template-columns:66px 1fr 38px;align-items:center;gap:9px;margin:11px 0;font-size:11px}.legend-row .bar{height:7px;background:#202b3a;border-radius:9px;overflow:hidden}.legend-row .fill{height:100%;border-radius:9px}.legend-row .n{text-align:right;color:var(--sub)}
.dashboard-intro{display:flex;justify-content:space-between;align-items:end;margin:25px 0 12px}.dashboard-intro h2{margin:0;font-size:18px}.dashboard-intro p{margin:4px 0 0;color:var(--sub);font-size:12px}.person-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}.person-card{background:linear-gradient(150deg,#151d29,#0f151f);border:1px solid #253143;border-radius:20px;padding:18px;box-shadow:0 12px 32px rgba(0,0,0,.2);transition:.2s}.person-card:hover{transform:translateY(-3px);border-color:#3d5270}.person-head{display:flex;justify-content:space-between;align-items:start}.person-avatar{width:43px;height:43px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand),var(--brand2));font-weight:900;font-size:17px}.person-card h3{margin:0;font-size:18px}.person-card .sub{font-size:11px;color:var(--sub);margin-top:3px}.premium-big{font-size:22px;font-weight:900;text-align:right}.premium-big small{display:block;font-size:10px;color:var(--sub);font-weight:600}.coverage-visual{display:grid;grid-template-columns:84px 1fr;gap:15px;align-items:center;margin:17px 0}.ring{--pct:50;--ring:var(--brand);width:82px;height:82px;border-radius:50%;background:conic-gradient(var(--ring) calc(var(--pct)*1%),#242e3d 0);display:grid;place-items:center;position:relative}.ring:after{content:"";width:59px;height:59px;border-radius:50%;background:#111822;position:absolute}.ring strong,.ring span{position:relative;z-index:1}.ring strong{font-size:18px}.ring span{display:block;font-size:9px;color:var(--sub);text-align:center}.coverage-bars .cb{display:grid;grid-template-columns:38px 1fr 25px;gap:7px;align-items:center;margin:7px 0;font-size:10px}.coverage-bars .track{height:6px;background:#252f3e;border-radius:9px;overflow:hidden}.coverage-bars .fill{height:100%;border-radius:9px}.coverage-bars .num{text-align:right;color:var(--sub)}.detail-btn{display:flex;justify-content:center;text-decoration:none;color:#dbe6ff;background:#1a2740;border:1px solid #315084;border-radius:11px;padding:9px;font-size:12px;font-weight:800}.detail-btn:hover{background:#22355a}
.summary-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}.stat{background:#121a25;border:1px solid #263244;border-radius:15px;padding:15px;position:relative;overflow:hidden}.stat:after{content:"";position:absolute;right:-20px;bottom:-28px;width:75px;height:75px;border-radius:50%;background:rgba(91,140,255,.08)}.stat .num{font-size:20px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat .lbl{font-size:10.5px;color:var(--sub);margin-top:3px}.section-shell{background:#0e151f;border:1px solid #202b3a;border-radius:18px;padding:16px;margin-bottom:16px}h2.sectitle{font-size:15px;margin:3px 0 13px;display:flex;align-items:center;gap:8px}h2.sectitle:before{content:"";width:4px;height:16px;border-radius:5px;background:linear-gradient(var(--brand),var(--brand2))}
.type-tabs,.cause-filters{display:flex;gap:6px;overflow:auto;scrollbar-width:none}.type-tabs{margin-bottom:9px}.type-tab,.cause-chip{flex:none;border-radius:999px;font-size:11px;font-weight:800;cursor:pointer}.type-tab{padding:7px 12px;background:#161f2c;color:var(--sub);border:1px solid #283548}.type-tab.active{background:#23365c;color:#c9d9ff;border-color:#46679f}.cause-chip{padding:6px 11px;border:1px solid transparent;opacity:.75}.cause-chip.active{opacity:1;box-shadow:inset 0 0 0 1px currentColor}.cause-chip[data-c="전체"]{background:#222b38;color:#d9e0ea}.cause-chip[data-c="실비"]{background:rgba(53,211,154,.13);color:var(--indemnity)}.cause-chip[data-c="암"]{background:rgba(255,102,120,.13);color:var(--cancer)}.cause-chip[data-c="질병"]{background:rgba(169,133,255,.13);color:var(--illness)}.cause-chip[data-c="상해"]{background:rgba(255,184,77,.13);color:var(--injury)}.cause-chip[data-c="치과"]{background:rgba(57,198,232,.13);color:var(--tooth)}.cause-chip[data-c="기타"]{background:rgba(141,154,173,.13);color:var(--etc)}
.policy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:10px}.policy-card{background:#131c28;border:1px solid #263244;border-radius:15px;padding:14px;position:relative}.policy-card .pc-top{display:flex;justify-content:space-between;gap:10px}.policy-card .company{font-size:10px;color:#91adff;font-weight:900}.policy-card .product{font-size:13px;font-weight:800;margin-top:3px;line-height:1.35}.policy-card .price{font-size:17px;font-weight:900;white-space:nowrap}.policy-card .meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.policy-card .meta div{background:#0e151f;border-radius:9px;padding:8px;font-size:9.5px;color:var(--sub)}.policy-card .meta b{display:block;color:#d5deeb;font-size:10.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.policy-actions{display:flex;justify-content:space-between;align-items:center;margin-top:11px}.status-badge{font-size:9.5px;font-weight:900;border-radius:999px;padding:4px 8px;background:#263142;color:var(--sub)}.status-유지,.status-badge[class*="유지"]{background:rgba(53,211,154,.13);color:var(--good)}.status-종료{background:rgba(141,154,173,.13);color:var(--sub)}.status-납입완료{background:rgba(57,198,232,.13);color:var(--cyan)}.status-확인필요{background:rgba(255,184,77,.13);color:var(--warn)}.pdf-btn{font-size:10px;color:#b9ccff;text-decoration:none;background:#1c2c4b;border:1px solid #34558e;padding:5px 9px;border-radius:7px;font-weight:900}

/* v2: 개인별 증권 표 + 보장 계층형 레이아웃 */

.policy-table tbody tr:last-child td{border-bottom:none}.policy-table tbody tr:hover td{background:#172231}
.policy-table .company-cell{font-weight:900;color:#9db8ff;white-space:nowrap}.policy-table .product-cell{min-width:260px;font-weight:800;line-height:1.45}
.policy-table .premium-cell{text-align:right;font-weight:900;font-size:13px;white-space:nowrap;color:#fff}.policy-table .date-cell{white-space:nowrap;color:#aab8ca}.policy-table .number-cell{white-space:nowrap;color:#b9c6d7}

.hierarchy-shell{display:grid;gap:18px}.major-block{border:1px solid #29384d;background:linear-gradient(145deg,#121b27,#0e151e);border-radius:18px;overflow:hidden}

.major-title-wrap{display:flex;gap:12px;align-items:center}.major-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;font-weight:900}
.major-block[data-major="질병"] .major-icon{background:rgba(124,92,255,.16);color:#aa94ff}.major-block[data-major="상해"] .major-icon{background:rgba(255,174,66,.16);color:#ffc56f}
.major-title{font-size:17px;font-weight:900;color:#fff}.major-sub{font-size:10.5px;color:#8999ad;margin-top:2px}.major-total{font-size:12px;color:#aebcd0}.major-total b{font-size:18px;color:#fff;margin-right:3px}

.mid-group{padding:15px 16px 17px}.mid-group+.mid-group{border-top:1px solid #233044}.mid-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.mid-title{font-size:13px;font-weight:900;color:#e7edf7}.mid-count{font-size:10px;color:#8f9fb4;background:#1b2634;border:1px solid #2b3b50;border-radius:999px;padding:3px 8px}
.detail-table-wrap{overflow:auto;border:1px solid #263549;border-radius:13px}.detail-table{width:100%;border-collapse:collapse;min-width:760px;font-size:11.5px}.detail-table th{background:#172230;color:#8495aa;padding:8px 10px;text-align:left;font-size:10px;white-space:nowrap}.detail-table td{padding:10px;border-top:1px solid #222f40;vertical-align:top}.detail-table tbody tr:hover td{background:#151f2c}
.detail-table .detail-name{min-width:330px;font-weight:700;color:#e2e8f1;line-height:1.5}.detail-table .detail-source{min-width:210px;color:#8fa0b5;line-height:1.4}.detail-table .detail-amount{width:150px;text-align:right;color:#fff;font-weight:900;white-space:nowrap}.detail-table .detail-action{text-align:right;white-space:nowrap}

/* 전체 보장 구성표 */

.coverage-map-title{font-size:15px;font-weight:900;color:#fff}.coverage-map-desc{font-size:10.5px;color:#8fa0b5;margin-top:3px}.coverage-map-count{font-size:11px;color:#9cacbf}.coverage-map-count b{font-size:18px;color:#fff;margin-right:3px}

/* v4: 보장영역별 전체표 */

.coverage-overview-table tr:hover td{background:rgba(91,140,255,.045)}
.overview-domain{width:135px;background:#14171b!important;border-right:1px solid var(--line);color:#fff}
.overview-domain strong{display:block;font-size:14px;margin-bottom:6px;color:#8fb0ff}
.overview-domain small{display:block;color:var(--sub);font-size:10.5px;line-height:1.45;font-weight:400}

.overview-item{min-width:380px;color:#eaf0fa;line-height:1.5}
.overview-amount{width:150px;text-align:right;color:#fff;font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums}
.overview-source{width:190px;color:var(--sub);font-size:11px}.overview-source b{color:#9db8ff}

.detail-card-list{display:grid;gap:8px;padding:12px}

<div id="pw-gate" style="position:fixed;inset:0;z-index:99999;background:#0b0d12;display:flex;align-items:center;justify-content:center;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;">

    <input id="pw-input" type="password" autocomplete="off" style="padding:10px 14px;border-radius:8px;border:1px solid #2b3240;background:#131722;color:#f4f7fb;font-size:14px;outline:none;" />
    <button id="pw-submit" style="margin-left:8px;padding:10px 16px;border-radius:8px;border:none;background:#3b82f6;color:#fff;font-weight:700;cursor:pointer;">확인</button>
    <div id="pw-error" style="color:#fb7185;font-size:12px;margin-top:10px;display:none;">비밀번호가 틀렸습니다</div>
  </div>

<script>
(function(){
  function pwhash(str){var x=5381;for(var i=0;i<str.length;i++){x=((x*33)^str.charCodeAt(i))>>>0;}return x.toString(16);}
  var PW_HASH='7c5545c5';
  var KEY='ins_dash_auth_ok';
  var gate=document.getElementById('pw-gate');
  if (localStorage.getItem(KEY)===PW_HASH){ gate.remove(); }
  else {
    document.documentElement.style.overflow='hidden';
    var input=document.getElementById('pw-input');
    var err=document.getElementById('pw-error');
    function tryAuth(){
      if (pwhash(input.value)===PW_HASH){
        localStorage.setItem(KEY, PW_HASH);
        gate.remove();
        document.documentElement.style.overflow='';
      } else {
        err.style.display='block';
        input.value='';
        input.focus();
      }
    }
    document.getElementById('pw-submit').addEventListener('click', tryAuth);
    input.addEventListener('keydown', function(e){ if(e.key==='Enter') tryAuth(); });
    setTimeout(function(){ input.focus(); }, 50);
  }
})();
</script>

function classifyType(text){
  const t = text;
  if(t.includes('사망') || t.includes('후유장해') || t.includes('장해')) return '사망·후유장해';
  if(t.includes('진단')) return '진단비';
  if(t.includes('수술')) return '수술비';
  if(t.includes('입원')) return '입원비';
  if(t.includes('통원')) return '통원비';
  if(t.includes('치료')) return '치료비';
  return '기타';
}

function extractAmounts(text){
  const m = text.match(/[0-9][0-9,]*(?:\.[0-9]+)?\s*원/g);
  return m ? m.join(' / ') : '-';
}

function esc(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function buildItemsForPerson(person){
  const policies = DATA[person] || [];
  const items = [];
  policies.forEach(pol=>{
    (pol.coverage||[]).forEach(c=>{
      items.push({
        text: c,
        cause: classifyCause(c),
        type: classifyType(c),
        company: pol.company,
        product: pol.product,
        file: pol.file,
        person: person
      });
    });
  });
  return items;
}

function buildItems(scope){
  if(scope === ALL){
    let items = [];
    PEOPLE.forEach(p => items = items.concat(buildItemsForPerson(p)));
    return items;
  }
  return buildItemsForPerson(scope);
}

let currentPerson = ALL;
let currentType = "전체";
let currentCause = "전체";
let currentSearch = "";

function renderPersonTabs(){
  const wrap = document.getElementById('personTabs');
  let html = `<div class="tab all-tab ${currentPerson===ALL?'active':''}" onclick="selectPerson('${ALL}')">전체 <span class="count">(${PEOPLE.length}명)</span></div>`;
  html += PEOPLE.map(p=>{
    const cnt = DATA[p].length;
    return `<div class="tab ${p===currentPerson?'active':''}" onclick="selectPerson('${p}')">${p} <span class="count">(${cnt}건)</span></div>`;
  }).join('');
  wrap.innerHTML = html;
}

function selectPerson(p){
  currentPerson = p;
  currentType = "전체";
  currentCause = "전체";
  document.body.classList.toggle('person-mode', p!==ALL);
  renderPersonTabs();
  renderMain();
}

function pdfHref(file){ return DRIVE_MAP[file] ? DRIVE_MAP[file] : encodeURI(file); }

function getSearchTerms(query){
  const q=String(query||'').trim().toLowerCase();
  if(!q) return [];
  const synonymMap={
    '치과':['치과','치아','치수','신경치료','크라운','레진','인레이','온레이','스케일링','치석','발치','임플란트','틀니','브릿지','치주','잇몸','부정교합','보철','보존치료'],
    '치아':['치아','치과','치수','신경치료','크라운','레진','인레이','온레이','스케일링','치석','발치','임플란트','틀니','브릿지','치주','잇몸','부정교합','보철','보존치료'],
    '실손':['실손','실비','의료비'],
    '실비':['실비','실손','의료비']
  };
  return synonymMap[q]||[q];
}

function matchesSearch(it){
  if(!currentSearch) return true;
  const haystack=`${it.text||''} ${it.product||''} ${it.company||''}`.toLowerCase();
  const terms=getSearchTerms(currentSearch);
  return terms.some(term=>haystack.includes(term));
}

function highlightSearch(text){
  if(!currentSearch) return esc(text);
  const q = currentSearch;
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  return esc(text).replace(re, m=>`<mark>${m}</mark>`);
}

function personSummaryData(person){
  const items = buildItemsForPerson(person);
  const policies = DATA[person] || [];
  const totalPremium = policies.reduce((s,p)=> s + (p.status==='납입완료' ? 0 : (p.premiumMonthly||0)), 0);
  const typeCounts = {}; TYPES.slice(1).forEach(t=>typeCounts[t]=0);
  const causeCounts = {}; CATS.slice(1).forEach(c=>causeCounts[c]=0);
  items.forEach(it=>{ typeCounts[it.type]=(typeCounts[it.type]||0)+1; causeCounts[it.cause]=(causeCounts[it.cause]||0)+1; });
  return { policies, items, totalPremium, typeCounts, causeCounts };
}

function renderPersonCard(person){
  const s = personSummaryData(person);
  const maxCause = Math.max(...CATS.slice(1).map(c=>s.causeCounts[c]||0),1);
  const mainCoverage = s.causeCounts['암'] + s.causeCounts['질병'];
  const pct = Math.min(100, Math.round((mainCoverage/Math.max(s.items.length,1))*100));
  const bars = ['암','질병','상해','치과'].map(c=>`<div class="cb"><span>${c}</span><div class="track"><div class="fill" style="width:${Math.max(5,(s.causeCounts[c]/maxCause)*100)}%;background:${CAT_DOT[c]}"></div></div><span class="num">${s.causeCounts[c]}</span></div>`).join('');
  return `<div class="person-card">
    <div class="person-head"><div style="display:flex;gap:11px;align-items:center"><div class="person-avatar">${esc(person).slice(0,1)}</div><div><h3>${esc(person)}</h3><div class="sub">증권 ${s.policies.length}건 · 보장 ${s.items.length}건</div></div></div><div class="premium-big">${s.totalPremium.toLocaleString()}원<small>월 납입 보험료</small></div></div>
    <div class="coverage-visual"><div class="ring" style="--pct:${pct};--ring:${CAT_DOT['질병']}"><div><strong>${pct}%</strong><span>질병·암 비중</span></div></div><div class="coverage-bars">${bars}</div></div>
    <a class="detail-btn" href="javascript:selectPerson('${person}')">보험 구성 자세히 보기 →</a>
  </div>`;
}

function hexA(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

}

function renderTable(items, showPerson){
  return `<div class="coverage-list">${items.map(it=>`<article class="coverage-item row-cat-${it.cause}"><div><div class="ci-title">${showPerson?`<b style="color:#91adff">${esc(it.person)}</b> · `:''}${highlightSearch(it.text)}</div><div class="ci-src">${esc(it.company)} · ${esc(it.product)}</div></div><div class="ci-right"><div class="ci-amount">${esc(extractAmounts(it.text))}</div><span class="cause-tag">${esc(it.cause)}</span><div style="margin-top:8px"><a class="pdf-btn" href="${pdfHref(it.file)}" target="_blank">PDF</a></div></div></article>`).join('')}</div>`;
}

function classifyDomain(text, product=''){
  const t = `${text||''} ${product||''}`;

  // 1차 대분류는 질환명이 아니라 보험의 성격을 기준으로 구분합니다.
  if(/실손|실비|의료비\[갱신|종합입원|종합통원|급여의료비|비급여의료비/.test(t)) return '실손의료';
  if(/운전자|자동차사고|교통사고처리|교통상해|대중교통|벌금|변호사선임|스쿨존|보복운전|자동차사고부상/.test(t)) return '운전자보험';
  if(/치과|치아|치수|크라운|레진|인레이|온레이|스케일링|발치|임플란트|틀니|브릿지|치주|부정교합/.test(t.replace(/치아파절/g,''))) return '치과';
  if(/간병|장기요양|간호간병|간병인/.test(t)) return '간병';
  if(/상해|재해|골절|화상|깁스|창상|흉터|외상|폭력|후유장해|장해급여/.test(t)) return '상해';
  if(/암|종양|항암|백혈병|림프종|카티|CAR-T|뇌|심장|심근|허혈|관상동맥|부정맥|혈전용해|질병|감염|당뇨|신부전|간질환|소화계|통풍|대상포진|요로결석|수막염|폐질환/.test(t)) return '질병';
  if(/종신|주계약.*사망|사망보험금|일반사망|연금전환되는 변액종신|통합종신/.test(t)) return '종신·사망';
  return '기타';
}

function classifyBenefit(text, domain=''){
  const t=String(text||'');
  if(/실손|실비|급여의료비|비급여의료비|종합입원의료비|종합통원의료비/.test(t)) return '실손의료';
  if(/사망/.test(t)){
    if(domain==='질병') return '질병 사망';
    if(domain==='상해') return '상해 사망';
    if(domain==='운전자보험') return '교통 사망';
    return '사망';
  }
  if(/진단비|진단보험금|진단급여|진단 확정|진단시/.test(t)) return '진단비';
  if(/수술비|수술급여|수술치료|수술담보|이식수술|절제/.test(t)) return '수술비';
  if(/입원일당|입원비|입원급여|입원보험금|중환자실/.test(t)) return '입원비';
  if(/통원|외래|응급실/.test(t)) return '통원비';
  if(/항암|약물치료|방사선치료|재활치료|치료비|처치/.test(t)) return '치료비';
  if(/후유장해|장해보험|장해급여|장해연금|장해지급/.test(t)) return '후유장해';
  if(/벌금|변호사|처리지원|배상책임|법률비용/.test(t)) return '비용손해';
  if(/납입면제|보험료납입지원/.test(t)) return '납입면제';
  if(/연금|환급금|축하금|적립금/.test(t)) return '연금·환급';
  return '기타';
}

function safeId(v){return String(v).replace(/[^가-힣a-zA-Z0-9_-]/g,'-');}
function domainDescription(domain){
  const m={
    '종신·사망':'종신보험 주계약과 일반 사망보험금 보장','실손의료':'실제 발생한 입원·통원 의료비 보장','질병':'암·뇌·심장 및 일반질병의 진단·수술·입원 보장','상해':'재해·골절·화상·후유장해 등 상해 관련 보장','운전자보험':'교통사고 처리지원금·벌금·변호사비 등 운전자 보장','치과':'치아 진단·보존·보철·발치 치료 보장','간병':'간병인 및 간호간병통합서비스 보장','기타':'그 밖의 특약·환급·연금 및 부가 보장'
  }; return m[domain]||'';
}

function renderCoverageOverview(items){
  const benefitOrder=['실손의료','진단비','수술비','입원비','통원비','치료비','후유장해','질병 사망','상해 사망','교통 사망','사망','비용손해','납입면제','연금·환급','기타'];
  const domainOrder=['실손의료','질병','상해','운전자보험','종신·사망','치과','간병','기타'];
  const sorted=[...items].sort((a,b)=>{
    const ad=classifyDomain(a.text,a.product), bd=classifyDomain(b.text,b.product);
    const ab=classifyBenefit(a.text,ad), bb=classifyBenefit(b.text,bd);
    const adi=domainOrder.indexOf(ad), bdi=domainOrder.indexOf(bd);
    if(adi!==bdi) return (adi<0?999:adi)-(bdi<0?999:bdi);
    const abi=benefitOrder.indexOf(ab), bbi=benefitOrder.indexOf(bb);
    if(abi!==bbi) return (abi<0?999:abi)-(bbi<0?999:bbi);
    return a.text.localeCompare(b.text,'ko');
  });

  // 대분류가 너무 길게 한 셀로 이어지지 않도록 중분류 3개 단위로 구간을 나눕니다.
  const rowsData=[];
  domainOrder.forEach(domain=>{
    const domainItems=sorted.filter(it=>classifyDomain(it.text,it.product)===domain);
    if(!domainItems.length) return;
    const benefits=[...new Set(domainItems.map(it=>classifyBenefit(it.text,domain)))].sort((a,b)=>benefitOrder.indexOf(a)-benefitOrder.indexOf(b));
    const chunks=[];
    for(let i=0;i<benefits.length;i+=3) chunks.push(benefits.slice(i,i+3));
    chunks.forEach((chunk,chunkIndex)=>{
      chunk.forEach(benefit=>{
        domainItems.filter(it=>classifyBenefit(it.text,domain)===benefit).forEach(it=>rowsData.push({it,domain,benefit,chunkIndex,chunkCount:chunks.length,chunkBenefits:chunk}));
      });
    });
  });

  const chunkCounts={};
  const benefitCounts={};
  rowsData.forEach(r=>{
    const ck=`${r.domain}||${r.chunkIndex}`;
    chunkCounts[ck]=(chunkCounts[ck]||0)+1;
    const bk=`${ck}||${r.benefit}`;
    benefitCounts[bk]=(benefitCounts[bk]||0)+1;
  });

  let prevChunk='';
  let prevBenefit='';
  const rows=rowsData.map(r=>{
    const {it,domain,benefit,chunkIndex,chunkCount,chunkBenefits}=r;
    const chunkKey=`${domain}||${chunkIndex}`;
    const benefitKey=`${chunkKey}||${benefit}`;
    const id=`detail-${safeId(domain)}-${safeId(benefit)}`;
    const sourceTitle=`${it.company} · ${it.product}`;
    const seq=chunkCount>1?`<span class="domain-seq">${chunkIndex+1}/${chunkCount}</span>`:'';
    const range=chunkCount>1?`<span class="domain-range">${chunkBenefits.map(esc).join(' · ')}</span>`:'';
    const isChunkStart=chunkKey!==prevChunk;
    const isBenefitStart=benefitKey!==prevBenefit;
    const domainCell=isChunkStart
      ? `<td class="overview-domain" rowspan="${chunkCounts[chunkKey]}" title="${esc(domain)}"><strong>${esc(domain)}</strong>${seq}<span class="group-count">${chunkCounts[chunkKey]}개 항목</span>${range}</td>`:'';
    const benefitCell=isBenefitStart
      ? `<td class="overview-benefit" rowspan="${benefitCounts[benefitKey]}" title="${esc(benefit)}">${esc(benefit)}<span class="group-count">${benefitCounts[benefitKey]}개</span></td>`:'';
    const rowClass=`overview-row${isChunkStart?' domain-start':''}${!isChunkStart&&isBenefitStart?' benefit-start':''}`;
    prevChunk=chunkKey;
    prevBenefit=benefitKey;
    return `<tr class="${rowClass}">${domainCell}${benefitCell}<td class="overview-item" title="${esc(it.text)}">${highlightSearch(it.text)}</td><td class="overview-amount" title="${esc(extractAmounts(it.text))}">${esc(extractAmounts(it.text))}</td><td class="overview-source" title="${esc(sourceTitle)}"><b>${esc(it.company)}</b> · ${esc(it.product)}</td><td class="overview-action"><button onclick="document.getElementById('${id}').scrollIntoView({behavior:'smooth',block:'start'})">상세</button></td></tr>`;
  });
  return `<div class="coverage-map"><div class="coverage-map-head"><div><div class="coverage-map-title">전체 보장 현황표</div><div class="coverage-map-desc">대분류는 중분류 3개 단위로 나눠 반복 표시하고, 같은 중분류의 보장 항목은 하나로 묶어 표시합니다.</div></div><div class="coverage-map-count"><b>${items.length}</b>건</div></div><div class="coverage-map-table-wrap"><table class="coverage-overview-table"><thead><tr><th>대분류</th><th>중분류</th><th>소분류 · 보장 항목</th><th>가입금액</th><th>보험사 · 상품</th><th></th></tr></thead><tbody>${rows.join('')}</tbody></table></div></div>`;
}

function renderHierarchyRows(list){
  return `<div class="detail-card-list">${list.map(it=>`<article class="detail-card"><div class="detail-card-main"><div class="detail-name">${highlightSearch(it.text)}</div><div class="detail-explain"><span>${esc(it.company)}</span><span>${esc(it.product)}</span></div></div><div class="detail-card-side"><div class="detail-amount">${esc(extractAmounts(it.text))}</div><a class="pdf-btn" href="${pdfHref(it.file)}" target="_blank">원문 PDF ↗</a></div></article>`).join('')}</div>`;
}

function renderCoverageHierarchy(items){
  const order=['실손의료','질병','상해','운전자보험','종신·사망','치과','간병','기타'];
  return `<div class="hierarchy-shell">${order.map(domain=>{
    const domainItems=items.filter(it=>classifyDomain(it.text,it.product)===domain);
    if(!domainItems.length) return '';
    const groups={}; domainItems.forEach(it=>{const b=classifyBenefit(it.text,domain);(groups[b]??=[]).push(it);});
    const benefitOrder=['실손의료','진단비','수술비','입원비','통원비','치료비','후유장해','질병 사망','상해 사망','교통 사망','사망','비용손해','납입면제','연금·환급','기타'];
    const groupHtml=Object.entries(groups).sort((a,b)=>benefitOrder.indexOf(a[0])-benefitOrder.indexOf(b[0])).map(([benefit,list])=>`<div class="mid-group" id="detail-${safeId(domain)}-${safeId(benefit)}"><div class="mid-head"><div><div class="mid-title">${esc(benefit)}</div><div class="mid-description">${list.length}개 담보의 지급조건과 가입금액</div></div><div class="mid-count">${list.length}건</div></div>${renderHierarchyRows(list)}</div>`).join('');
    return `<section class="major-block domain-${safeId(domain)}"><div class="major-head"><div class="major-title-wrap"><div class="major-icon">◆</div><div><div class="major-title">${esc(domain)}</div><div class="major-sub">${esc(domainDescription(domain))}</div></div></div><div class="major-total"><b>${domainItems.length}</b>건</div></div>${groupHtml}</section>`;
  }).join('')}</div>`;
}

function renderPersonDetail(person){
  const wrap = document.getElementById('mainArea');
  const s = personSummaryData(person);
  const visibleItems = s.items.filter(matchesSearch);
  const domainCount=new Set(visibleItems.map(it=>classifyDomain(it.text,it.product))).size;
  const summaryHtml = `<div class="summary-row"><div class="stat"><div class="num">${s.policies.length}</div><div class="lbl">보유 증권 수</div></div><div class="stat"><div class="num">${s.totalPremium.toLocaleString()}원</div><div class="lbl">월 보험료 합계</div></div><div class="stat"><div class="num">${visibleItems.length}</div><div class="lbl">전체 보장 항목</div></div><div class="stat"><div class="num">${domainCount}</div><div class="lbl">보장영역</div></div></div>`;
  const policyHtml = `<section class="section-shell person-policy-section"><h2 class="sectitle">보유 증권</h2><p class="hierarchy-note">현재 유지 중이거나 상태 확인이 필요한 증권만 표시합니다. 종료·해지 완료 보험은 제외했습니다.</p>${renderPolicyTable(person)}</section>`;
  const overview = visibleItems.length ? renderCoverageOverview(visibleItems) : '<div class="empty">일치하는 보장 항목이 없습니다.</div>';
  const hierarchy = visibleItems.length ? renderCoverageHierarchy(visibleItems) : '';
  wrap.innerHTML = `<div class="person-top-fixed"><div class="dashboard-intro"><div><h2>${esc(person)} 보험 대시보드</h2><p>종신·사망, 실손, 암, 질병, 상해, 운전자 등 보험 성격별 보장을 한눈에 확인하세요.</p></div></div>${summaryHtml}</div>${policyHtml}<section class="section-shell"><h2 class="sectitle">전체 보장 현황</h2><p class="hierarchy-note">상단 표에는 실제 항목과 가입금액을 모두 표시하고, 하단 상세 영역에는 보험사·상품·원문과 함께 지급조건을 구분해 표시합니다.</p>${overview}<div class="detail-divider"><span>보장영역별 상세 내용</span></div>${hierarchy}</section>`;
}

function selectType(t){ currentType = t; renderMain(); }
function selectCause(c){ currentCause = c; renderMain(); }

function renderMain(){
  const scopeLabel = document.getElementById('scopeLabel');
  scopeLabel.textContent = currentPerson===ALL ? '(전체 가족 대상 검색)' : `(${currentPerson} 안에서만 검색)`;

  if(currentPerson === ALL){
    if(currentSearch) renderAllSearch();
    else renderAllOverview();
  } else {
    renderPersonDetail(currentPerson);
  }
}

function doSearch(q){
  document.getElementById('searchInput').value = q;
  currentSearch = q;
  renderMain();
}

document.getElementById('searchInput').addEventListener('input', (e)=>{
  currentSearch = e.target.value.trim();
  renderMain();
});

function clearSearch(){
  document.getElementById('searchInput').value = '';
  currentSearch = '';
  renderMain();
}

document.body.classList.toggle('person-mode', currentPerson!==ALL);
renderPersonTabs();
renderMain();
</script>
